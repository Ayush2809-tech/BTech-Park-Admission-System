{% extends 'login/base.html' %}

{% load static %}

{% block content %}

<style>
    .info-card {

        margin-top: 70px;
        border-radius: 30px;
        padding: 30px;
        border: 1px solid rgba(189, 234, 219, 0.832);
        box-shadow: 0px 0px 50px #9ed1c042;
    }

    h4 {
        color: #324d3e;
        font-weight: 800;
    }

    .contact-icon {
        background-color: #2d4940;
        width: 55px;
        height: 55px;
        border-radius: 12px;
        margin-bottom: 20px;
        padding: 10px;
    }

    .btn-main {
        background-color: rgb(216, 185, 105);
        font-weight: 800;
        border-radius: 50px;
        padding: 12px;
    }
</style>


<div class="row " style=" background: linear-gradient(90deg, #395044, #0b7d57);">
    <section class="inner-hero p-0 mt-4 mb-5">
        <div class="container pt-5"><span class="py-2 px-4 text-light fw-bold"
                style="background-color: #63efc030; border-radius: 30px;  border:1px solid rgba(255, 255, 255, 0.411);">Contact</span>
            <h1 class="mt-3 pt-3" style="color: white; font-weight: 900;">Contact Us</h1>
            <p class="lead text-light mb-5">Get admission-related support and portal assistance.</p>
        </div>
    </section>
</div>


<section class="section section-white">
    <div class="container">

        <div class="row g-4">
            <div class="col-lg-4">
                <div class="info-card">
                    <div class="contact-icon"><img src="{% static 'image/location.png' %}" alt="" height="35px;">
                    </div>
                    <h4>Address</h4>
                    <p class="mb-0 text-muted">Biotech Park, Lucknow, Uttar Pradesh</p>
                </div>
            </div>
            <div class="col-lg-4">
                <div class="info-card">
                    <div class="contact-icon"><img src="{% static 'image/email.png' %}" alt="" height="35px;"></div>
                    <h4>Email</h4>
                    <p class="mb-0 text-muted">info@biotechpark.org.in</p>
                </div>
            </div>
            <div class="col-lg-4">
                <div class="info-card">
                    <div class="contact-icon"><img src="{% static 'image/phone.png' %}" alt="" height="35px;"></div>
                    <h4>Phone</h4>
                    <p class="mb-0 text-muted">+91-0000000000</p>
                </div>
            </div>
        </div>
        <div class="info-card mt-4 mb-5 pb-5">
            <h4>Send Enquiry</h4>
            <form action="/enquiry_save/" method="POST"><input type="hidden" name="csrfmiddlewaretoken"
                    value="GZWr86pnOhf1JOm2CZe4BZXn5RX6jzuzejMO6iZwzmwENIb835iAN9n0emQPBdOX">
                <div class="row g-3">
                    <div class="col-md-6"><input name="Name" class="form-control p-2" placeholder="Your Name"
                            required="">
                    </div>
                    <div class="col-md-6"><select name="Gender" class="form-select p-2" required="">
                            <option value="">Select Gender</option>
                            <option>Male</option>
                            <option>Female</option>
                            <option>Other</option>
                        </select></div>
                    <div class="col-md-6"><input type="email" name="Emailaddress" class="form-control p-2"
                            placeholder="Email Address" required=""></div>
                    <div class="col-md-6"><input name="Contactno" class="form-control p-2" placeholder="Contact No"
                            required=""></div>
                    <div class="col-12"><textarea name="Address" class="form-control p-2" rows="2" placeholder="Address"
                            required=""></textarea></div>
                    <div class="col-12"><textarea name="Enquirytext" class="form-control p-2" rows="5"
                            placeholder="Message" required=""></textarea></div>
                    <div class="col-12"><button class="btn btn-main px-4 p-2 mt-2">Submit Enquiry</button></div>
                </div>
            </form>
        </div>
    </div>
</section>

{% endblock %}
